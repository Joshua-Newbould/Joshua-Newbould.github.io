<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Flap speed test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #fff; }
  canvas { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; background: rgba(0,0,0,.86); border: 1px solid #333; border-radius: 10px; padding: 10px 12px; }
  #status { font-size: 15px; font-weight: 700; }
  #info { color: #aaa; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 4px; border-bottom: 1px solid #222; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #888; font-weight: 400; }
  td.bad { color: #ff7a6e; } td.ok { color: #ffd479; } td.good { color: #7fe0a8; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button, a.btn { flex: 1; font: inherit; font-size: 14px; text-align: center; padding: 11px 6px; border-radius: 8px; background: #222; color: #ddd; text-decoration: none; border: 1px solid #444; }
  #run { background: #fff; color: #000; font-weight: 700; border-color: #fff; }
  #run:disabled { opacity: .4; }
  .seg { display: flex; flex: 1.4; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
  .seg a { flex: 1; text-align: center; padding: 11px 4px; color: #aaa; text-decoration: none; background: #181818; }
  .seg a.on { background: #ddd; color: #000; font-weight: 700; }
</style>
<canvas id="c"></canvas>
<div id="hud">
  <div id="status">Ready</div>
  <div id="info"></div>
  <table id="res"></table>
  <div class="row">
    <button id="run">Run test</button>
    <div class="seg"><a id="m-gl" href="?mode=gl">GPU</a><a id="m-2d" href="?mode=2d">2D</a></div>
  </div>
</div>
<script type="module" src="bench.js"></script>
</html>
