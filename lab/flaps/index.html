<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Flap speed test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #fff; }
  canvas { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); background: rgba(0,0,0,.82); border: 1px solid #333; border-radius: 10px; padding: 10px 12px; }
  #stats { white-space: pre-wrap; font-size: 13px; }
  .big { font-size: 22px; font-weight: 700; }
  .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  a { flex: 1; text-align: center; padding: 10px 6px; border-radius: 8px; background: #222; color: #ddd; text-decoration: none; border: 1px solid #444; min-width: 70px; }
  a.on { background: #fff; color: #000; border-color: #fff; font-weight: 700; }
</style>
<canvas id="c"></canvas>
<div id="hud">
  <div id="stats">starting…</div>
  <div class="row" id="mode"></div>
  <div class="row" id="size"></div>
</div>
<script type="module" src="bench.js"></script>
</html>
